# compile-scene-spec skill 契约（REQ-VIS-03 / REQ-AGENT-02/03/04 / Phase 32）
# 字段镜像 backend 注册入口（app.schemas.agent_runtime.SkillVersionRegister）。
#
# Phase 32 版本化 Scene Spec / Prompt 编译技能：
#   - 本技能是 Phase 32 确定性域能力（scene_spec/compiler.py +
#     prompt_compiler/adapters.py）的 Agent 消费边界（D-32-01..D-32-04）；
#     允许的工具 allowlist 只含 2 个只读域工具（get_visual_bible /
#     get_evidence_span），编排绝不越出该 allowlist（未知工具/白名单外调用 →
#     fail closed）。validated SceneCandidate 与 provider capabilities 由
#     服务端确定性编译器按引用消费（candidate_set_id/candidate_key/
#     visual_bible_version_id/source_snapshot_id），不是 Agent 工具。
#   - write_permissions 恒为空：Agent 不直接写任何域状态（不写 Canon、不写
#     Visual Bible、不写 key-scene 集、不写 scene_spec/prompt 域表）。唯一输出
#     通道是后端确定性 finalizer 持久化的 SceneSpecArtifact / PromptArtifact
#     （candidate-only 官方输出）。
#   - approval_required_for 声明 `scene_spec:approve`：用户审查/批准只授权
#     Phase 33 消费（FrozenSceneSpecView/PromptRevisionView.approved_only），
#     是显式、append-only 的服务端状态迁移（D-32-04）。Agent 只能创建 candidate
#     Artifact 并暂停等待审批，**不能**直接授予或伪造批准；FastAPI 与确定性
#     validators（Canon/Visual Bible 一致性 + 不支持的细节拒绝）保留 permission /
#     evidence / state-transition / publication 权威。除声明审批动作外的任何
#     ApprovalRequest / Publisher / promotion / 写回 Canon 或 Visual Bible →
#     fail closed。
#   - 版本由 `version` 钉住（当前 1.0.0）；每次 run 经 skill_version_id 绑定
#     SkillVersion 血缘（run 绑定 owner/novel/branch、SkillRun、ToolRuns、
#     input hash、source snapshot、model/runtime lineage、output Artifact
#     revision）。
#   - 模型结构化输出走共享 26-06 normalizer + 严格 post-repair validator；
#     normalization_actions / raw_hash / repaired_hash / warnings 保留在官方
#     SceneSpecArtifact / PromptArtifact 上。未支持细节（unsupported canon、
#     未来剧透、冲突主张、缺 Visual Bible 引用）绝不进入正向 prompt 段，只能以
#     reason-coded uncertainties 呈现（D-32-02）。
name: compile-scene-spec
version: 1.0.0
description: >-
  Phase 32 版本化 Scene Spec / Prompt 编译技能：给定小说（owner/novel/branch +
  已批准 Visual Bible revision + frozen key-scene set 引用 + source snapshot），
  通过 2 个只读域工具（get_visual_bible / get_evidence_span）收集证据，产出
  **血缘绑定**的 SceneSpecArtifact 与 PromptArtifact：确定性编译器
  （scene_spec.compiler / prompt_compiler.adapters）按引用消费 validated
  SceneCandidate 与 Visual Bible 版本，无 unsupported Canon；Canon/Visual Bible
  一致性 + 未支持细节 validator 拥有 legality 权威；`scene_spec:approve` 用户审查
  只授权 Phase 33 消费（D-32-04）。绝不写回 Canon / Visual Bible / key-scene 集 /
  scene_spec 域表；未知工具/权限/血缘/schema drift/错误 owner/approval
  bypass/未支持细节被当作 Canon → 一律 fail closed，无官方 Artifact 或域写入。
allowed_tools:
  - get_visual_bible
  - get_evidence_span
read_permissions:
  - canon
  - visual_bible
  - key_scene
  - scene_spec
write_permissions: []
forbidden_spaces:
  - canon:original
  - visual_bible:write
  - key_scene:write
  - scene_spec:write
budget:
  max_calls: 40
  max_input_tokens: 40000
  max_output_tokens: 12000
  max_cost_usd: "4.00"
approval_required_for:
  - scene_spec:approve
input_schema: ./input.schema.json
output_schema: ./output.schema.json
