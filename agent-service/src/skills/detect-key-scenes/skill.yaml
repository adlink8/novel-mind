# detect-key-scenes skill 契约（REQ-VIS-02 / REQ-AGENT-02/03/04 / Phase 31）
# 字段镜像 backend 注册入口（app.schemas.agent_runtime.SkillVersionRegister）。
#
# Phase 31 版本化关键场景检测技能：
#   - 本技能是 Phase 31 确定性域能力（boundaries/scoring/candidates/review）的
#     Agent 消费边界（D-31-01..D-31-05）；允许的工具 allowlist 只含 6 个只读域工具
#     （get_events / get_character_state / get_relationships / get_visual_bible /
#     get_evidence_span / search_novel_text），编排绝不越出该 allowlist（未知工具/白名单外调用 →
#     fail closed）。
#   - write_permissions 恒为空：Agent 不直接写任何域状态（不写 Canon、不写
#     key-scene 候选集、不写 review 决策）。唯一输出通道是后端确定性 finalizer
#     持久化的 SceneCandidateArtifact（candidate-only）。
#   - approval_required_for 声明 `key_scene:approve`：用户选择/审查是成为 frozen
#     key-scene 集的显式、append-only 服务端状态迁移（D-31-04）。Agent 只能创建
#     candidate Artifact 并暂停等待审批，**不能**直接授予或伪造批准；FastAPI 与
#     确定性 validators（score/diversity/density/spoiler）保留 permission /
#     evidence / state-transition / publication 权威。除声明的审批动作外的任何
#     ApprovalRequest / Publisher / promotion 动作 → fail closed。
#   - 版本由 `version` 钉住（当前 1.0.0）；每次 run 经 skill_version_id 绑定
#     SkillVersion 血缘（run 绑定 owner/novel/branch、SkillRun、ToolRuns、
#     input hash、source snapshot、model/runtime lineage、output Artifact
#     revision）。
#   - 模型结构化输出走共享 26-06 normalizer + 严格 post-repair validator；
#     normalization_actions / raw_hash / repaired_hash / warnings 保留在官方
#     SceneCandidateArtifact 上。speaker/dialogue heuristic 信号（D-31-05）只是
#     候选元数据，绝不进入 evidence_ranges / citation / Canon / 审批原因。
name: detect-key-scenes
version: 1.1.0
description: >-
  Phase 31 版本化关键场景检测技能：给定小说（owner/novel/branch + cutoff +
  source snapshot + 可选 approved Visual Bible revision 血缘），通过 5 个只读域工具
  （get_events / get_character_state / get_relationships / get_visual_bible /
  get_evidence_span / search_novel_text）收集证据与候选信号，产出**血缘绑定**的 SceneCandidateArtifact：
  完整 SceneCandidateSetContract（ordered candidates / diversity keys /
  evidence refs / spoiler cutoff / salience reasons / advisory
  speaker_dialogue_signal）作为 candidate-only 官方输出。确定性
  score/diversity/density/spoiler validator 拥有 legality 权威；
  `key_scene:approve` 用户选择/审查后候选集才 frozen（D-31-04）。绝不进入 Canon /
  active reader state；未知工具/权限/血缘/schema drift/错误 owner/approval
  bypass/heuristic 信号被当作证据 → 一律 fail closed，无官方 Artifact 或域写入。
allowed_tools:
  - get_events
  - get_character_state
  - get_relationships
  - get_visual_bible
  - get_evidence_span
  - search_novel_text
read_permissions:
  - canon
  - world_model
  - visual_bible
  - key_scene
write_permissions: []
forbidden_spaces:
  - canon:original
  - key_scene:write
  - visual_bible:write
  - derivative:write
budget:
  max_calls: 60
  max_input_tokens: 60000
  max_output_tokens: 12000
  max_cost_usd: "4.00"
approval_required_for:
  - key_scene:approve
input_schema: ./input.schema.json
output_schema: ./output.schema.json
