# propose-illustration-anchor skill 契约（REQ-VIS-05 / REQ-AGENT-03/04/07 / Phase 34）
# 字段镜像 backend 注册入口（app.schemas.agent_runtime.SkillVersionRegister）。
#
# Phase 34 版本化锚点提议技能：
#   - 本技能是 Phase 34 确定性锚点域能力（D-34-01..D-34-04，proposal → Web
#     Approval → deterministic publisher → valid anchor）的 Agent 消费边界；
#     允许的工具 allowlist 含 3 个只读域工具 + 2 个 action 工具
#     （publish_illustration / attach_illustration_to_text），编排绝不越出该
#     allowlist（未知工具/白名单外调用 → fail closed）。
#   - 本技能消费 **proposal-ready** AssetRevision（Phase 33 handoff，rights
#     cleared）+ 精确 source span（excerpt + anchor_hash + chapter_content_hash
#     + source snapshot）→ 通过 action 工具创建 IllustrationAnchorProposal
#     （candidate-only，status=proposed）+ 服务端权威 Web ApprovalRequest
#     （action = publish_illustration / attach_illustration_to_text，payload_hash
#     确定性重放）。唯一官方输出是血缘绑定的 IllustrationAnchorProposal
#     （proposal-only，见 output.schema.json）。
#   - **确定性发布属于后端**：只有 Phase 34 deterministic publisher
#     （app.services.illustration_anchors.publish）在 ApprovalRequest 批准后
#     原子校验 approval action + payload hash + proposal_ready asset + exact
#     source hash/range/version + owner/novel/branch/fork scope，才创建 published
#     asset 引用 + valid anchor + publish manifest。Agent/浏览器绝不发布。
#   - write_permissions 恒为空：Agent 不直接写任何域状态（不写 Canon、不写
#     illustration 域表、不写 ApprovalRequest 行、不写 published 状态、不写
#     anchor 表）。两个 action 工具只创建候选 proposal + pending ApprovalRequest。
#   - 版本由 `version` 钉住（当前 1.0.0）；每次 run 经 skill_version_id 绑定
#     SkillVersion 血缘（run 绑定 owner/novel/authority_space、可选 branch/fork、
#     SkillRun、ToolRuns、source/input hashes、model/runtime lineage、Artifact
#     revision）。
#   - 模型结构化输出走共享 26-06 normalizer + 严格 post-repair validator；
#     normalization_actions / raw_hash / repaired_hash / warnings 保留在官方
#     IllustrationAnchorProposal 上。Agent 只产出候选 proposal——绝不自动发布
#     （D-34-01）。
name: propose-illustration-anchor
version: 1.0.0
description: >-
  Phase 34 版本化锚点提议技能（REQ-VIS-05 / REQ-AGENT-03/04/07）：给定
  owner/novel/authority_space（可选 branch/fork 用于 derivative mode）+ 精确
  source span + proposal-ready AssetRevision（Phase 33 handoff，rights cleared），
  通过 3 个只读域工具 + 2 个 action 工具（publish_illustration /
  attach_illustration_to_text）消费 Phase 34 确定性锚点域能力，产出血缘绑定的
  IllustrationAnchorProposal（candidate-only）。Action 工具只创建候选 proposal +
  pending Web ApprovalRequest（approval 权威在 FastAPI，D-11）；只有确定性
  publisher（backend app.services.illustration_anchors.publish）在批准后原子校验
  approval action + payload hash + proposal_ready asset + exact source
  hash/range/version + owner/novel/branch/fork scope，才创建 published asset 引用
  + valid anchor + publish manifest（D-34-01）。Agent/浏览器绝不发布；未知工具/
  权限/血缘/schema drift/错误 owner/branch/fork/approval bypass/stale revision/
  取消 → 一律 fail closed，无官方 Artifact 或域写入。
allowed_tools:
  - get_novel
  - get_chapter
  - search_novel_text
  - publish_illustration
  - attach_illustration_to_text
read_permissions:
  - canon
  - illustration
write_permissions: []
forbidden_spaces:
  - canon:original
  - illustration:write
  - illustration:publish
  - approval_request
  - publisher
budget:
  max_calls: 40
  max_input_tokens: 40000
  max_output_tokens: 12000
  max_cost_usd: "4.00"
approval_required_for:
  - publish_illustration
  - attach_illustration_to_text
input_schema: ./input.schema.json
output_schema: ./output.schema.json
