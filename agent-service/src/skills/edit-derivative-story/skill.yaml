# edit-derivative-story skill 契约（REQ-FORK-02 / REQ-AGENT-03/04/07 / Phase 36）
# 字段镜像 backend 注册入口（app.schemas.agent_runtime.SkillVersionRegister）。
#
# Phase 36 版本化 derivative editor 技能：
#   - 本技能是 Phase 36 确定性 derivative 编辑域能力（D-36-01..D-36-04，候选
#     DerivativeEditProposal → Web Approval → 确定性 Revision Service 应用）的
#     Agent 消费边界；允许的工具 allowlist 含 6 个只读域工具 + 1 个 action 工具
#     （apply_derivative_edit），编排绝不越出该 allowlist（未知工具/白名单外调用
#     → fail closed）。
#   - 本技能消费只读 branch 上下文（owner/novel/branch/fork 血缘绑定）+ 派生
#     chapter 编辑意图（project/chapter/base revision + 候选 Markdown patch）→
#     通过 action 工具创建 **candidate DerivativeEditProposal**
#     （proposal_status=proposed）+ 服务端权威 pending Web ApprovalRequest
#     （action = apply_derivative_edit，payload_hash 确定性重放）。
#   - **确定性应用属于后端 Revision Service**：只有确定性 Revision Service
#     （app.services.derivative_editor.revisions.apply_agent_edit）在用户 Web
#     批准后原子校验 approval action + payload hash + 冻结 proposal artifact 血缘
#     + owner/novel/branch/fork scope + 同一 base_revision CAS，才把 approved
#     proposal 应用为 append-only agent_proposal 修订。Agent/浏览器绝不直接写
#     Original Canon、user draft（autosave）revisions 或 published 状态。
#   - write_permissions 恒为空：Agent 不直接写任何域状态（不写 user autosave、
#     不写 derivative chapter/revision 表、不写 ApprovalRequest 行、不写 published
#     状态）。action 工具只创建候选 proposal + pending ApprovalRequest。
#   - 版本由 `version` 钉住（当前 1.0.0）；每次 run 经 skill_version_id 绑定
#     SkillVersion 血缘（run 绑定 owner/novel/branch/fork、SkillRun、ToolRuns、
#     source/input hashes、model/runtime lineage、Artifact revision）。
#   - 模型结构化输出走共享 26-06 normalizer + 严格 post-repair validator；
#     normalization_actions / raw_hash / repaired_hash / warnings 保留在官方
#     DerivativeEditProposalArtifact 上。Agent 只产出候选 proposal —— 绝不自动
#     应用（D-36-02，确定性 Revision Service 拥有 approved proposal 应用）。
name: edit-derivative-story
version: 1.0.0
description: >-
  Phase 36 版本化 derivative editor 技能（REQ-FORK-02 / REQ-AGENT-03/04/07）：
  给定 owner/novel/branch（可选 fork 用于 derivative mode）+ 只读 branch 上下文
  血缘 + 派生 chapter 编辑意图（project_id / chapter_id / base_revision /
  proposal_key / 候选 Markdown patch / source snapshot 血缘 / evidence refs），
  通过 6 个只读域工具 + 1 个 action 工具（apply_derivative_edit）消费 Phase 36
  确定性 derivative 编辑域能力，产出候选 DerivativeEditProposal（candidate-only）。
  Action 工具只创建候选 proposal + pending Web ApprovalRequest（approval 权威在
  FastAPI，D-11）；只有确定性 Revision Service
  （backend app.services.derivative_editor.revisions.apply_agent_edit）在批准后
  原子校验 approval action + payload hash + 冻结 proposal artifact 血缘 +
  owner/novel/branch/fork scope + 同一 base_revision CAS，才把 approved proposal
  应用为 append-only agent_proposal 修订（D-36-02）。Agent/浏览器绝不直接写
  Original Canon、user draft（autosave）revisions 或 published 状态；user_autosave
  与 agent_proposal 使用分离端点/事件类型/actor 标签/CAS 路径。未知工具/权限/
  血缘/schema drift/错误 owner/branch/fork/approval bypass/stale revision/取消 →
  一律 fail closed，无官方 Artifact 或域写入。
allowed_tools:
  - get_novel
  - get_chapter
  - get_timeline
  - get_relationships
  - get_clues
  - get_narrative_memory
  - apply_derivative_edit
read_permissions:
  - canon
  - fanfiction_canon
write_permissions: []
forbidden_spaces:
  - canon:original
  - user_interpretation
  - derivative:autosave
  - derivative:direct_write
  - approval_request
  - revision_service
budget:
  max_calls: 30
  max_input_tokens: 30000
  max_output_tokens: 10000
  max_cost_usd: "3.00"
approval_required_for:
  - apply_derivative_edit
input_schema: ./input.schema.json
output_schema: ./output.schema.json
