# NovelMind local Cloudflare Tunnel (Windows) — 模板
#
# 本文件为公开仓库中的脱敏模板：以下均为占位符（<...>），
# 使用前请替换为你的真实值（tunnel-id、用户目录、域名）。
# 本地实际运行副本位于 $env:USERPROFILE\.cloudflared\config.novelmind-win.yml，
# 该副本包含真实凭据，不应提交到版本库。
#
# FE: https://<fe-domain>  -> 127.0.0.1:3005
# API direct (optional): https://<api-domain> -> 127.0.0.1:8010
# Prefer FE /api rewrite to local backend when only using the FE hostname.

tunnel: <tunnel-id>
credentials-file: <user-profile>\.cloudflared\<tunnel-id>.json

ingress:
  - hostname: <fe-domain>
    service: http://127.0.0.1:3005
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s
  - hostname: <api-domain>
    service: http://127.0.0.1:8010
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s
  - service: http_status:404
