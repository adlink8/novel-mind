[pytest]
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_functions = test_*
# Explicit marker selection only — never implicitly exclude e2e (D-04).
# Coverage/timeout tools locked: pytest-cov==7.1.0, pytest-timeout==2.4.0
addopts = -v --tb=short --strict-markers --strict-config
# Default timeout is a safety net; per-marker timeouts applied in conftest (D-16).
timeout = 30
timeout_method = thread
markers =
    unit: Isolated unit tests (timeout 5s)
    integration: Multi-component tests with real services (timeout 30s)
    contract: Schema/API/policy contract tests (timeout 15s)
    live: Requires external live dependencies such as Ollama (timeout 180s)
    e2e: Cross-layer end-to-end scope; must be combined with a primary marker
    adversarial: Adversarial / red-team robustness tests (timeout 30s)
